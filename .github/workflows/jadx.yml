name: Package jadx

on:
  push:
    branches:
      - agent/current-apk-recovery

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download jadx
        run: curl -L --fail -o jadx-1.5.6.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6
          path: jadx-1.5.6.zip
          if-no-files-found: error
