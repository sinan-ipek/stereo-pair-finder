name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply alignment tolerance fix
        run: |
          sed -i 's/private const val MAX_VERTICAL_ERROR_PX = 4.0/private const val MAX_VERTICAL_ERROR_PX = 5.0/' app/src/main/java/com/stereopairfinder/image/StereoAnalyzer.kt
          sed -i 's/private const val VERTICAL_ERROR_CONFIDENCE_PENALTY = 10.0/private const val VERTICAL_ERROR_CONFIDENCE_PENALTY = 8.0/' app/src/main/java/com/stereopairfinder/image/StereoAnalyzer.kt
          sed -i 's/versionCode = 7/versionCode = 8/' app/build.gradle.kts
          sed -i 's/versionName = "1.6-four-three-resume"/versionName = "1.6.1-alignment-tolerance"/' app/build.gradle.kts

      - name: Persist alignment tolerance fix
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/stereopairfinder/image/StereoAnalyzer.kt app/build.gradle.kts
            git commit -m "Relax vertical alignment acceptance"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stereo-pair-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
